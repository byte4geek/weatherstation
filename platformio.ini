; PlatformIO Project Configuration File
; Supports both ESP8266 (NodeMCU v2 / ESP-12E) and ESP32 (ESP32-WROOM-32 / DevKitC).

[platformio]
; Default build target remains nodemcuv2 (ESP8266) for backward compatibility.
; Use `pio run -e esp32dev` (or select esp32dev in VS Code) to build for ESP32 / ESP32-WROOM.
default_envs = nodemcuv2

; ============================================================================
; ESP8266 Environment (NodeMCU 1.0 / ESP-12E)
; ============================================================================
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

; Deep search mode for dependencies
lib_ldf_mode = deep

lib_deps =
    SPI
    Wire
    tzapu/WiFiManager @ ^2.0.16-rc.2
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    vshymanskyy/Preferences @ ^2.1.0
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    sciosense/ScioSense_ENS16x @ ^2.0.1
    https://github.com/krzychb/EspSaveCrash.git

; Build flags for optional online weather services uploaders.
; Uncomment flags below to compile specific uploaders into firmware:
build_flags =
    -DWEATHER_UPLOAD_WUNDERGROUND=1
;    -DWEATHER_UPLOAD_PWSWEATHER=1
;    -DWEATHER_UPLOAD_CWOP=1
;    -DWEATHER_UPLOAD_WEATHERCLOUD=1
    -DWEATHER_UPLOAD_WINDY=1
;    -DWEATHER_UPLOAD_AWEKAS=1
;    -DWEATHER_UPLOAD_WOW_BE=1

; ============================================================================
; ESP32 Environment (ESP32-WROOM-32 / ESP32 DevKitC / NodeMCU-32S)
; ============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Use min_spiffs partition scheme (two 1.9MB OTA app slots: ota_0 and ota_1) so Web UI OTA updates work on ESP32
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_ldf_mode = deep

; Note: Preferences is built into the ESP32 Arduino core; EspSaveCrash is ESP8266-specific.
lib_deps =
    SPI
    Wire
    tzapu/WiFiManager @ ^2.0.16-rc.2
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    sciosense/ScioSense_ENS16x @ ^2.0.1

; ESP32 has ample RAM and Flash, allowing all weather service uploaders to be enabled if desired
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DWEATHER_UPLOAD_WUNDERGROUND=1
    -DWEATHER_UPLOAD_PWSWEATHER=1
    -DWEATHER_UPLOAD_CWOP=1
    -DWEATHER_UPLOAD_WEATHERCLOUD=1
    -DWEATHER_UPLOAD_WINDY=1
    -DWEATHER_UPLOAD_AWEKAS=1
    -DWEATHER_UPLOAD_WOW_BE=1
